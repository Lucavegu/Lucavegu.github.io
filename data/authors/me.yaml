bio: |
  Lucas Venegas is a veterinarian and researcher working where host genomics
  meets the microbiome in aquaculture and livestock. His doctoral research, a
  joint program between the University of Chile and Laval University (IBIS),
  asks whether host genome and skin microbiome information can predict sea lice
  burden in Atlantic salmon. At Laval University he also works on a mobile
  microbial biobank and omics tools for restoring soil health in the Charlevoix
  region. Earlier projects covered the microbiota-gut-brain axis in pigs and
  antimicrobial resistance in food and aquaculture systems.

